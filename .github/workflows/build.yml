name: Build and Release

on:
  push:
    tags: ['v*']
    # KEINE preview/**-Branches. Vorabversionen werden ausschliesslich im
    # privaten Repo ha-device-inventory-preview gebaut und landen in einem
    # privaten ghcr-Package. Dieses Repo ist oeffentlich und liefert nur die
    # gekaufte, stabile Version aus. Siehe Guard-Job "no-preview-on-main".
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Preview und Verkaufsversion duerfen sich nicht vermischen. Dieses Repo ist
  # oeffentlich: was hier auf main liegt, erscheint bei jedem Kunden im
  # Add-on-Store. Eine Preview-Add-on-Definition darf es hier nie geben — auch
  # nicht versehentlich ueber einen Merge aus einem Testbranch.
  no-preview-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keine Preview-Artefakte im oeffentlichen Repo
        run: |
          fail=0
          if [ -e addon-preview ]; then
            echo "::error::addon-preview/ liegt in diesem Repo. Preview gehoert ins private Repo ha-device-inventory-preview." >&2
            fail=1
          fi
          # Muster zusammengesetzt, damit dieser Job nicht sich selbst findet.
          slug="geraeteverwaltung""-preview"
          if grep -rIl --exclude-dir=.git --exclude-dir=node_modules "$slug" . > /tmp/hits 2>/dev/null && [ -s /tmp/hits ]; then
            echo "::error::Der Preview-Slug kommt in diesem Repo vor:" >&2
            cat /tmp/hits >&2
            fail=1
          fi
          exit $fail

  # Build frontend once on native amd64 — shared by all Docker jobs below.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build:
    needs: [no-preview-on-main, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build Docker image
        run: docker build -f addon/Dockerfile -t geraeteverwaltung:test .

      - name: Test Docker image
        run: |
          docker run --rm -d --name gv-test -p 3001:3001 geraeteverwaltung:test
          sleep 10
          curl -f http://localhost:3001/ || exit 1
          docker stop gv-test

  dev-release:
    needs: [no-preview-on-main, frontend, build]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # develop -> :dev. Mehr gibt es hier nicht: Preview-Tags gehoeren nicht
      # in dieses oeffentliche Package.
      - name: Determine dev image tag
        id: devmeta
        run: echo "tag=dev" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            ADDON_VERSION=${{ steps.devmeta.outputs.tag }}
          tags: |
            ghcr.io/derregner-de/${{ matrix.arch }}-ha-device-inventory:${{ steps.devmeta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    needs: [no-preview-on-main, frontend, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION_BARE="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"

      - name: Build and push image (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            ADDON_VERSION=${{ steps.meta.outputs.version_bare }}
          tags: |
            ghcr.io/derregner-de/${{ matrix.arch }}-ha-device-inventory:${{ steps.meta.outputs.version }}
            ghcr.io/derregner-de/${{ matrix.arch }}-ha-device-inventory:${{ steps.meta.outputs.version_bare }}
            ghcr.io/derregner-de/${{ matrix.arch }}-ha-device-inventory:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Veroeffentlicht den GitHub-Release zum Tag, damit die Release-Seite nicht
  # hinter den ausgelieferten Add-on-Versionen zurueckbleibt. Notes kommen aus
  # dem passenden Abschnitt von addon/CHANGELOG.md.
  github-release:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 == "## " v {f=1; next}
            f && /^## [0-9]/ {exit}
            f {print}
          ' addon/CHANGELOG.md | sed 's/^### /## /' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Siehe addon/CHANGELOG.md — fuer $VERSION wurde kein Abschnitt gefunden." > release-notes.md
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest
          fi
