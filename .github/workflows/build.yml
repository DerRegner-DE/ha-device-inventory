name: Build and Release

on:
  push:
    tags: ['v*']
    # preview/**: Vorabversionen, die als eigenes Add-on
    # ("Geraeteverwaltung (Preview)") parallel zur stabilen Installation
    # getestet werden. Siehe addon-preview/config.yaml.
    branches: [develop, 'preview/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Build frontend once on native amd64 — shared by all Docker jobs below.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build Docker image
        run: docker build -f addon/Dockerfile -t geraeteverwaltung:test .

      - name: Test Docker image
        run: |
          docker run --rm -d --name gv-test -p 3001:3001 geraeteverwaltung:test
          sleep 10
          curl -f http://localhost:3001/ || exit 1
          docker stop gv-test

  dev-release:
    needs: [frontend, build]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/preview/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # develop -> :dev (wie bisher).
      # preview/** -> Tag = version aus addon-preview/config.yaml. Supervisor
      # zieht <image>:<version>, beides muss also uebereinstimmen; fuer eine
      # neue Testrunde die Version dort hochzaehlen.
      - name: Determine dev image tag
        id: devmeta
        run: |
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -E '^version:' addon-preview/config.yaml | head -1 | sed -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
            if [ -z "$VERSION" ]; then
              echo "addon-preview/config.yaml enthaelt keine version" >&2
              exit 1
            fi
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push dev image (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            ADDON_VERSION=${{ steps.devmeta.outputs.tag }}
          tags: |
            ghcr.io/derregner-de/${{ matrix.arch }}-ha-device-inventory:${{ steps.devmeta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    needs: [frontend, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION_BARE="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"

      - name: Build and push image (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            ADDON_VERSION=${{ steps.meta.outputs.version_bare }}
          tags: |
            ghcr.io/derregner-de/${{ matrix.arch }}-ha-device-inventory:${{ steps.meta.outputs.version }}
            ghcr.io/derregner-de/${{ matrix.arch }}-ha-device-inventory:${{ steps.meta.outputs.version_bare }}
            ghcr.io/derregner-de/${{ matrix.arch }}-ha-device-inventory:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Veroeffentlicht den GitHub-Release zum Tag, damit die Release-Seite nicht
  # hinter den ausgelieferten Add-on-Versionen zurueckbleibt. Notes kommen aus
  # dem passenden Abschnitt von addon/CHANGELOG.md.
  github-release:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 == "## " v {f=1; next}
            f && /^## [0-9]/ {exit}
            f {print}
          ' addon/CHANGELOG.md | sed 's/^### /## /' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Siehe addon/CHANGELOG.md — fuer $VERSION wurde kein Abschnitt gefunden." > release-notes.md
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest
          fi
