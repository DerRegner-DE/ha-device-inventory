name: "Geräteverwaltung"
description: "Smart Home Device Inventory Management - Offline-First PWA"
version: "3.1.0"
slug: "geraeteverwaltung"
url: "https://github.com/DerRegner-DE/ha-device-inventory"
arch:
  - amd64
  - aarch64
  - armv7
image: "ghcr.io/derregner-de/{arch}-ha-device-inventory"
homeassistant_api: true
# v3.1.0: MQTT-Zugangsdaten automatisch vom Supervisor (Mosquitto-Add-on).
# run.sh fragt /services/mqtt ab -- ohne diese Freigabe verweigert der
# Supervisor die Auskunft, und Benutzer/Passwort mussten von Hand rein.
services:
  - "mqtt:want"
ingress: true
ingress_port: 3001
ingress_stream: true
panel_icon: "mdi:devices"
panel_title: "Geräteverwaltung"
map:
  - addon_config:rw
  - media:rw
options:
  language: "de"
  license_key: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_client_id: ""
  mqtt_node_id: "geraeteverwaltung"
schema:
  language: "str"
  license_key: "str?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_user: "str?"
  mqtt_password: "str?"
  mqtt_client_id: "str?"
  mqtt_node_id: "str?"
startup: "application"
init: false
